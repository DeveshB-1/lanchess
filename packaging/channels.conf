# Publishing settings for LAN Chess releases: the GitHub repository and the
# AUR package maintainer.
#
# Shell syntax (KEY="value", no variables), read by packaging/build_packages.py
# --aur and usable with `. packaging/channels.conf`.
#
# AUR_USER is your aur.archlinux.org account (the one holding the SSH key you
# push with); replace the CHANGE_ME_ placeholder before publishing.
# AUR_MAINTAINER goes into the "# Maintainer:" line of the AUR PKGBUILD.
AUR_USER="CHANGE_ME_AUR_USERNAME"
AUR_MAINTAINER="Devesh B <devesh.b@esds.co.in>"
GITHUB_REPO="DeveshB-1/lanchess"
