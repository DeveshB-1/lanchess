    <path fill="#262421" d="M21 46 C20.5 39.5 23.5 35 29 31.5 C26 32.5 22.5 34.5 19.5 35.5 C17.5 36.2 16 36.8 14.6 35.8 C12.6 34.4 12 32.6 12.9 30.8 L21 19.5 C22 16.5 23.6 13.6 25.4 11.4 L26.4 7.8 L29.4 10.8 C31.4 10.3 33.6 10.5 35.5 11.3 C44.5 14.8 48.5 23.5 47.4 33.5 C47 37.8 46.2 42 45.6 46 Z"/>
    <rect x="17.5" y="45" width="29" height="5" rx="1.8" fill="#262421"/>
