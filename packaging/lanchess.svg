  <circle cx="15.8" cy="32" r="0.9" fill="#ffffff"/>
  <path d="M37.5 16.5 C41.5 20 43.3 25.5 43 31.5" fill="none" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round"/>
